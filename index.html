<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090e" id="meta-theme">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Movie Night — tell it your mood, answer a few this-or-that questions, and get the movie or show that fits tonight. Solo or as a couple.">
<title>Movie Night — Find tonight's movie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Apply the saved theme before first paint so there is no colour flash. */
(function () {
  try {
    var t = JSON.parse(localStorage.getItem('movienight.theme.v1') || 'null');
    if (!t || !t.vars) return;
    var r = document.documentElement;
    for (var k in t.vars) r.style.setProperty(k, t.vars[k]);
    r.setAttribute('data-mode', t.mode === 'light' ? 'light' : 'dark');
    var m = document.getElementById('meta-theme'); if (m && t.vars['--bg']) m.setAttribute('content', t.vars['--bg']);
  } catch (e) { /* ignore */ }
})();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#app">Skip to content</a>

<header class="app-header">
  <button id="menu-btn" class="icon-btn" aria-label="Open your watchlists" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span id="menu-count" class="badge-dot hidden">0</span>
  </button>
  <button class="brand" data-goto="home" aria-label="Movie Night home">
    <svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="4" fill="currentColor"/><path d="M10 9l5 3-5 3z" fill="var(--accent-ink)"/></svg>
    <span>Movie Night</span>
  </button>
  <nav class="topnav" aria-label="Primary">
    <button data-goto="home" class="tab active">Home</button><button data-goto="quiz" class="tab">Quiz</button><button data-goto="top20" class="tab">Top 20</button><button data-goto="shuffle" class="tab">Shuffle</button><button data-goto="account" class="tab">Account</button>
  </nav>
  <span class="header-spacer"></span>
  <button id="header-profile" class="header-profile" aria-label="Open your account"></button>
</header>

<!-- WATCHLIST DRAWER (hamburger) -->
<div id="drawer-scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-label="Your watchlists" aria-hidden="true">
  <div class="drawer-head">
    <div><div class="eyebrow">Your lists</div><h2>Watchlists</h2></div>
    <button id="drawer-close" class="icon-btn" aria-label="Close watchlists"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<main id="app">
  <!-- HOME -->
  <section id="view-home" class="view active">
    <div id="hero-featured"></div>
    <div class="seg-group" id="media-switch" role="tablist" aria-label="Movies or TV shows" style="margin:22px 0 4px">
      <button data-media="movies" class="seg selected" role="tab">Movies</button>
      <button data-media="shows" class="seg" role="tab">TV Shows</button>
    </div>
    <div class="browse-bar">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search titles, directors, cast, vibes…" autocomplete="off" aria-label="Search">
      </label>
      <select id="sort" aria-label="Sort"></select>
    </div>
    <div id="genre-chips" class="chips" role="group" aria-label="Filter by genre"></div>
    <p id="browse-count" class="count-line"></p>
    <div id="grid" class="grid"></div>
    <button id="show-more" class="btn btn-block btn-lg hidden" style="margin-top:18px">Show more</button>
  </section>

  <!-- QUIZ (solo + couples, movies + TV) -->
  <section id="view-quiz" class="view">
    <div id="quiz-setup" class="panel"></div>
    <div id="quiz-play" class="hidden">
      <div class="progress-wrap"><div id="quiz-progress" class="progress"></div></div>
      <p id="quiz-counter" class="counter"></p>
      <div id="quiz-inplay" class="inplay hidden"></div>
      <h2 id="quiz-q" class="quiz-q">Which are you more in the mood for?</h2>
      <div id="quiz-pair" class="pair"></div>
      <div class="pair-alt">
        <button id="quiz-undo" class="btn btn-ghost" title="Go back one question">↶ Back</button>
        <button id="quiz-both" class="btn btn-ghost">Both sound good</button>
        <button id="quiz-neither" class="btn btn-ghost">Neither</button>
      </div>
    </div>
    <div id="quiz-results" class="hidden"></div>
  </section>

  <!-- TOP 20 -->
  <section id="view-top20" class="view"><div id="top20-root"></div></section>

  <!-- SHUFFLE -->
  <section id="view-shuffle" class="view">
    <div class="page-head"><span class="eyebrow">Roulette</span><h1>Shuffle Night</h1><p>Pick the kind of night you want, spin, and get five ranked picks with a match score for each.</p></div>
    <div class="panel">
      <div class="seg-group" id="shuffle-media" style="margin-bottom:6px">
        <button data-smedia="movies" class="seg selected">Movies</button><button data-smedia="shows" class="seg">TV Shows</button>
      </div>
      <div class="shuffle-modes" id="shuffle-modes"></div>
      <div class="row">
        <select id="shuffle-genre" aria-label="Limit shuffle to a genre" style="width:auto;min-width:160px"></select>
        <button id="shuffle-go" class="btn btn-primary btn-lg" style="flex:1;min-width:180px">🎲 Spin the roulette</button>
      </div>
    </div>
    <div id="shuffle-results"></div>
  </section>

  <!-- ACCOUNT -->
  <section id="view-account" class="view"><div id="account-root"></div></section>
</main>

<!-- TITLE DETAIL SHEET -->
<div id="detail-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Title details">
  <div class="sheet" id="detail-sheet"></div>
</div>

<!-- COUPLES: PASS THE PHONE -->
<div id="pass-overlay" class="overlay center hidden" role="dialog" aria-modal="true">
  <div class="pass-card">
    <div class="pass-emoji">📱💞</div>
    <p class="muted">Pass the phone…</p>
    <h2 id="pass-title"></h2>
    <p class="muted">Your turn to pick. No peeking at their answers.</p>
    <button id="pass-go" class="btn btn-primary btn-lg btn-block"></button>
  </div>
</div>

<!-- WELCOME / SIGN-IN (content built by js/app.js) -->
<div id="welcome-overlay" class="overlay center hidden" role="dialog" aria-modal="true">
  <div class="welcome-card" id="welcome-card"></div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<nav class="tabbar" aria-label="Main">
  <button data-goto="home" class="tab active"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-goto="quiz" class="tab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg><span>Quiz</span></button>
  <button data-goto="top20" class="tab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M9 21h6M12 14v7"/></svg><span>Top 20</span></button>
  <button data-goto="shuffle" class="tab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3c4 0 5 10 9 10h6M3 17h3c1.5 0 2.5-1.2 3.5-2.8M15 7h6M18 4l3 3-3 3M18 14l3 3-3 3"/></svg><span>Shuffle</span></button>
  <button data-goto="account" class="tab"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Account</span></button>
</nav>

<script src="js/movies.js"></script>
<script src="js/shows.js"></script>
<script src="js/engine.js"></script>
<script src="js/accounts.js"></script>
<script src="js/ratings.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
